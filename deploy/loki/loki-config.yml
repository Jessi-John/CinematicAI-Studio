# LOW #67: Minimal Loki configuration for centralized log aggregation.
# auth_enabled: true enables multi-tenant mode. Promtail and Grafana must
# send the X-Scope-OrgID header with the shared tenant ID stored in the
# loki_tenant_id Docker secret. This prevents arbitrary containers on the
# Docker network from pushing or querying logs without the tenant ID.
auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false

table_manager:
  retention_deletes_enabled: false
  retention_period: 0s
