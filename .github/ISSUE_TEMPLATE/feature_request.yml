name: Feature request
description: Propose a new capability or improvement for CinematicAI Studio
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem first, then the
        proposed solution. This helps the maintainer evaluate scope and impact.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who experiences it and when?
      placeholder: When generating a story, I cannot ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing features you considered.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Potential impact
      description: Who benefits, what changes for existing users, and whether this affects the API, data model, or deployment.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this relate to?
      options:
        - Story generation
        - Character or world continuity
        - Episode or scene editing
        - Frontend experience
        - API or integrations
        - Background processing
        - Authentication or administration
        - Observability or operations
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I described the problem before the proposed solution.
          required: true
