name: Bug report
description: Report a reproducible problem in CinematicAI Studio
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API keys, JWTs, cookies,
        database URLs, or other secrets in this issue. Security vulnerabilities
        must be reported privately according to SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of the problem.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that reliably reproduces the issue.
      placeholder: |
        1. Start the stack with ...
        2. Open ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error message if there is one.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the application is affected?
      options:
        - Frontend
        - Backend API
        - Background worker / queue
        - Story generation
        - Authentication or authorization
        - Database / migrations
        - Docker / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version or commit SHA you are running.
      placeholder: "1.0.0 or commit SHA"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, Docker version, browser, and deployment method.
      placeholder: |
        OS: Windows 11
        Node.js: 20.x
        Docker: 27.x
        Browser: Chrome 130
        Deployment: Docker Compose / local development
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste sanitized logs or attach screenshots. Remove secrets and personal data first.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials and personal data from this report.
          required: true
        - label: This is not a security vulnerability (those are reported privately).
          required: true
