global:
  scrape_interval: 15s
  evaluation_interval: 15s

# LOW #67: Load alert rules so Prometheus can evaluate them and forward
# firing alerts to Alertmanager.
rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:34567']
    metrics_path: '/metrics'

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:3002']
    metrics_path: '/metrics'

  - job_name: 'redis'
    # Fix: Use redis-exporter sidecar. Prometheus cannot scrape Redis directly
    # because Redis speaks the RESP protocol, not HTTP. The redis-exporter
    # container translates Redis metrics to Prometheus format.
    static_configs:
      - targets: ['redis-exporter:9121']
